<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="../../pages.css" />
		<title>Veterinaria Patitas Felices</title>
		<header><h1>Veterinaria Patitas Felices 🐾</h1></header>
	</head>
	<body>
		<main>
			<h2>Veterinario: <span id="vetName"></span></h2>
			<form action="submit" autocomplete="off">
				<h2 class="h2-editar">
					Editar consulta con ID: <span id="clinicId"></span>
				</h2>
				<div class="input-holder">
					<div class="inputBox">
						<label for="petId">ID Mascota: </label>
						<input type="text" id="petId" />
					</div>
					<div class="inputBox">
						<label for="consult">Consulta: </label>
						<input type="textarea" id="consult" />
					</div>
					<div class="inputBox">
						<label for="treatment">Tratamiento: </label>
						<input type="textarea" id="treatment" />
					</div>
				</div>
				<p id="error-message"></p>
				<button>Actualizar</button>
			</form>
			<button class="back"><a href="../vet.html">Volver</a></button>
		</main>
		<footer>
			<p>Trabajo práctico final de Desarrollo Web BackEnd - UTN</p>
			<p>Micaela Asselborn</p>
			<p>2026</p>
		</footer>
		<script src="editarConsulta.js"></script>
	</body>
</html>
