<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="../pages.css" />
		<title>Veterinaria Patitas Felices</title>
		<header><h1>Veterinaria Patitas Felices 🐾</h1></header>
	</head>
	<body>
		<main class="main">
			<h2>Veterinario: <span id="vetName"></span></h2>
			<h3 id="vetId"></h3>
			<fieldset id="pets-list">
				<legend>Macotas</legend>
				<div class="botonera">
					<button>
						<a href="./mascotas/crearMascota.html">Crear mascota</a>
					</button>
					<button>
						<a href="./mascotas/buscarMascota.html"
							>Buscar mascota</a
						>
					</button>
				</div>
				<div class="list"></div>
			</fieldset>
			<fieldset id="clinic-box">
				<legend>Consultas clinicas</legend>
				<div class="botonera">
					<button>Crear consulta</button>
					<button>Buscar consulta</button>
				</div>
				<div class="list"></div>
			</fieldset>
			<fieldset id="clients-box">
				<legend>Clientes</legend>
				<div class="botonera">
					<button>
						<a href="./clientes/crearCliente.html">Crear cliente</a>
					</button>
					<button>
						<a href="./clientes/buscarCliente.html"
							>Buscar cliente</a
						>
					</button>
				</div>
				<div class="list" id="clients-list"></div>
			</fieldset>
			<button class="logoff" onclick="logOff()">Desconectarse</button>
		</main>
		<footer>
			<p>Trabajo práctico final de Desarrollo Web BackEnd - UTN</p>
			<p>Micaela Asselborn</p>
			<p>2026</p>
		</footer>
		<script src="vet.js"></script>
	</body>
</html>
